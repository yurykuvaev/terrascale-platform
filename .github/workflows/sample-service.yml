name: sample-service

on:
  pull_request:
    paths:
      - "apps/sample-service/**"
      - ".github/workflows/sample-service.yml"
  push:
    branches: [master, main]
    paths:
      - "apps/sample-service/**"
      - ".github/workflows/sample-service.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write
  security-events: write   # Trivy uploads SARIF to GitHub code scanning

concurrency:
  group: sample-service-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}/sample-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: go mod tidy
        working-directory: apps/sample-service
        run: go mod tidy

      - name: go vet
        working-directory: apps/sample-service
        run: go vet ./...

      - name: go test
        working-directory: apps/sample-service
        run: go test -race -coverprofile=coverage.out ./...

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: sample-service-coverage
          path: apps/sample-service/coverage.out

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/sample-service
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            SOURCE_COMMIT=${{ github.sha }}

  trivy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.build.outputs.image-digest }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"   # report findings without failing the workflow
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
