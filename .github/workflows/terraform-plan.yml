name: terraform-plan

# Manual-only: this workflow needs the OIDC plan role and the S3 backend
# to exist in the target AWS account. Without that wiring it can't run
# `terragrunt plan`. Trigger from the Actions tab when AWS is connected.
on:
  workflow_dispatch:

permissions:
  id-token: write    # OIDC: assume the per-env plan role
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev]   # Add staging/prod once envs are wired.

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
          terraform_wrapper: false

      - name: install terragrunt
        run: |
          curl -sLo /usr/local/bin/terragrunt \
            https://github.com/gruntwork-io/terragrunt/releases/download/v0.66.9/terragrunt_linux_amd64
          chmod +x /usr/local/bin/terragrunt
          terragrunt -v

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/terrascale-${{ matrix.env }}-ci-plan
          aws-region: us-east-1

      - name: terragrunt run-all plan
        id: plan
        working-directory: terraform/live/${{ matrix.env }}
        env:
          TF_INPUT: "0"
          TF_IN_AUTOMATION: "1"
        run: |
          set -o pipefail
          terragrunt run-all plan \
            --terragrunt-non-interactive \
            --terragrunt-no-color \
            -no-color \
            -out=tfplan.bin 2>&1 | tee plan.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = "${{ matrix.env }}";
            const raw = fs.readFileSync(`terraform/live/${env}/plan.txt`, 'utf8');
            const trimmed = raw.length > 60000 ? raw.slice(0, 60000) + "\n... (truncated)" : raw;
            const body = [
              `### Terragrunt plan — \`${env}\``,
              "```diff",
              trimmed,
              "```",
            ].join("\n");
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
