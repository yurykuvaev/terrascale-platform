promtail:
  config:
    clients:
      - url: http://loki-gateway.observability.svc/loki/api/v1/push

    snippets:
      pipelineStages:
        - cri: {}
        - labeldrop:
            - filename
            - stream

      extraScrapeConfigs: |
        - job_name: kubernetes-events
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              target_label: app

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

  # Promtail runs on every node, including Karpenter-provisioned ones, so it
  # tolerates everything.
  tolerations:
    - operator: Exists
      effect: NoSchedule
