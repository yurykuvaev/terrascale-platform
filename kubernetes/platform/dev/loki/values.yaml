loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    storage:
      type: s3
      bucketNames:
        chunks: terrascale-dev-loki
        ruler:  terrascale-dev-loki
        admin:  terrascale-dev-loki
      s3:
        region: us-east-1
        # IAM is via IRSA on the service account; no static creds.
        s3ForcePathStyle: false
        insecure: false

    limits_config:
      retention_period: 720h    # 30 days; aligns with bucket lifecycle.
      max_query_lookback: 720h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      reject_old_samples: true
      reject_old_samples_max_age: 168h

    compactor:
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: s3

  serviceAccount:
    create: true
    name: loki
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/terrascale-dev-loki"

  singleBinary:
    replicas: 1
    nodeSelector:
      workload-class: system
    tolerations:
      - key: platform.terrascale.io/system
        operator: Equal
        value: "true"
        effect: NoSchedule
    persistence:
      enabled: true
      storageClass: gp3
      size: 20Gi

  gateway:
    enabled: true
    replicas: 1
    nodeSelector:
      workload-class: system
    tolerations:
      - key: platform.terrascale.io/system
        operator: Equal
        value: "true"
        effect: NoSchedule

  # The chunks-cache and results-cache memcached pods are overkill in dev.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # We don't run minio; chunks land directly in our IRSA-backed S3 bucket.
  minio:
    enabled: false

  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    lokiCanary:
      enabled: false

  test:
    enabled: false
