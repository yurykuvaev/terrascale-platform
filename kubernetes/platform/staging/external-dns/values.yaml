external-dns:
  provider:
    name: aws

  txtOwnerId: terrascale-staging
  txtPrefix: "_external-dns."

  policy: sync

  domainFilters:
    - staging.example.com
  zoneIdFilters:
    - "Z0123456789STAGING"

  serviceAccount:
    create: true
    name: external-dns
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/terrascale-staging-external-dns"

  nodeSelector:
    workload-class: system

  tolerations:
    - key: platform.terrascale.io/system
      operator: Equal
      value: "true"
      effect: NoSchedule
